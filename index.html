<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Car Stereo YouTube Player</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>	
	<div class="top-controls">
		<input type="text" class="yt-url" id="yt-url" placeholder="Paste YouTube link here..." />
		<button class="eject-btn" onclick="clearAudio()">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="#444444"><path d="M200-200v-80h560v80H200Zm14-160 266-400 266 400H214Zm266-80Zm-118 0h236L480-616 362-440Z"/></svg>
		</button>
	</div>

	<div class="led-display">
		<p id="display-text">YOUTUBE</p>

	</div>

	<div class="bottom-controls">
		<button class="rewind-btn" onclick="rewindAudio()">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="#444444"><path d="m480-320 56-56-64-64h168v-80H472l64-64-56-56-160 160 160 160Zm0 240q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
		</button>
		<button class="pause-btn" onclick="pauseAudio()">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="#444444"><path d="M360-320h80v-320h-80v320Zm160 0h80v-320h-80v320ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
		</button>

		<button class="stop-btn" onclick="stopAudio()">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="#444444"><path d="M320-320h320v-320H320v320ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
		</button>
	</div>

	<div class="footer">
		<p><a href="https://github.com/lunartransit64/car-stereo-youtube">GITHUB</a> -  Made by Lunar Transit - <a href="https://www.dafont.com/seven-segment.font">FONT</a></p>
		
	</div>

	<div class="audio-only-player" style="display: none;">
		<iframe
			id="yt-player"
			src=""
			allow="autoplay"
			referrerpolicy="strict-origin-when-cross-origin"
			frameborder="0">
		</iframe>
	</div>

	<script src="AudioPlay.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Car Stereo YouTube Player</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="led-display">
		<p id="display-text">YOUTUBE</p>

	</div>

	<div class="controls">
		<input type="text" id="yt-url" style="width: 300px;" placeholder="Paste YouTube link here..." />
		<button onclick="playAudio()">PLAY</button>
		<button onclick="pauseAudio()">PAUSE</button>
		<button onclick="stopAudio()">STOP</button>
	</div>

	<div class="footer">
		<a href="https://www.dafont.com/seven-segment.font">Font</a>
	</div>

	<div class="audio-only-player" style="display: none;">
		<iframe
			id="yt-player"
			src=""
			allow="autoplay"
			referrerpolicy="strict-origin-when-cross-origin"
			frameborder="0">
		</iframe>
	</div>

	<script src="AudioPlay.js"></script>
</body>
</html>
